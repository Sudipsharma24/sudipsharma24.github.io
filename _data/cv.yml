        location: Trondheim, Norway
        area: Electrification of Chemical Industries — CO₂ capture
        studyType: PhD
        start_date: 2024-10
        end_date: present
        highlights:
          - Supervisor — Prof. Thomas Alan Adams II (Process and Power group).
          - Modelling, simulation, and optimization of electrified CO₂-capture processes in open-source Python frameworks, focused on magnetic induction swing adsorption (MISA).
          - Funded by the NTNU–MIT Energy Research Programme (NMERP-C2).
      - institution: BIOCEB — European Master in Biological and Chemical Engineering for a Sustainable Bioeconomy (Erasmus Mundus Joint Master)
        location: URCA (France) · TalTech (Estonia) · ULiège (Belgium) · TU Graz (Austria)
        area: Biological and chemical engineering
        studyType: MSc
        start_date: 2022-09
        end_date: 2024-08
        highlights:
          - Thesis at TU Graz under Prof. Viktor Hacker — coupled techno-economic and life-cycle assessment of polyaniline-coated Pt/C catalysts for PEMFC electrodes; recycled-Pt sourcing cut cradle-to-gate global-warming impact by about 79%.
      - institution: Kathmandu University
