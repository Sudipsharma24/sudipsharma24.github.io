cv:
  name: Sudip Sharma
  label: PhD Candidate, Process Systems Engineering
  email: sudip.sharma@ntnu.no
  location: Trondheim, Norway
  image: ""
  summary: PhD researcher at NTNU building open-source first-principles models of next-generation CO₂ capture (magnetic induction swing adsorption, MISA) and coupling them with Gaussian-process surrogates, active learning, and multi-objective optimization. Backed by three years of industrial process R&D and quality-control experience and an Erasmus Mundus MSc spanning techno-economic analysis, life-cycle assessment, and analytical chemistry.

  social_networks:
